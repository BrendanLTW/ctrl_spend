name: ctrl_spend
description: "Offline-first personal budgeting app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  csv: ^8.0.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.4
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/fonts/OFL.txt
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
