<style>

a{color:#101828;text-decoration:none}a:hover{color:#344054}

.warn{color:#B54708}.neg{color:#D92D20}
.sheet{position:absolute;left:0;right:0;bottom:0;height:560px;background:#fff;border-radius:32px 32px 0 0}
.key{height:48px;border:0;border-radius:16px;background:#F2F4F7;font:600 21px Poppins,sans-serif;color:#101828;cursor:pointer;display:flex;align-items:center;justify-content:center}
.key:hover{background:#EAECF0}
.btn{position:absolute;left:16px;right:16px;bottom:28px;display:flex;align-items:center;justify-content:center;height:58px;border-radius:22px;background:#101828;color:#fff;font-size:17px;font-weight:600}

.r.dark .gi{color:#F2F4F7;border-bottom-color:#232C3A}.r.dark .gi:hover{background:#1B2331}

.r.dark .seg button.sel,.r.dark .chip.sel,.r.dark .cat.sel .ct,.r.dark .btn,.r.dark .pill,.r.dark .avatar,.r.dark .fab,.r.dark .toast{background:#F2F4F7;color:#0B1018}

.r.dark .cat.sel .ct svg,.r.dark .fab svg{stroke:#0B1018}
.r.dark .fab{box-shadow:0 10px 24px rgba(0,0,0,.5)}
.r.dark .toast button{color:#B54708}
.r.dark .hero{background:#1C2536}.r.dark .hero .bar{background:#344054}
.r.dark .neg{color:#F97066}.r.dark .pos{color:#47CD89}.r.dark .warn{color:#FDB022}
.r.dark .ic{background:rgba(124,77,219,.26)}.r.dark .ic svg{stroke:#B69BFF}
.r.dark .ic.food{background:rgba(251,140,0,.2)}.r.dark .ic.food svg{stroke:#FFB547}
.r.dark .ic.car{background:rgba(33,150,243,.22)}.r.dark .ic.car svg{stroke:#6CB8FF}
.r.dark .ic.bag{background:rgba(240,69,122,.22)}.r.dark .ic.bag svg{stroke:#FF7AA2}
.r.dark .ic.bolt{background:rgba(245,184,0,.2)}.r.dark .ic.bolt svg{stroke:#FFD34D}
.r.dark .ic.wallet{background:rgba(23,178,106,.22)}.r.dark .ic.wallet svg{stroke:#5BD996}
.r.dark .ic.health{background:rgba(240,68,56,.22)}.r.dark .ic.health svg{stroke:#FF8A80}
.r.dark .ic.gift{background:#232C3A}.r.dark .ic.gift svg{stroke:#98A2B3}
.r.dark .stat .c.out{background:rgba(240,68,56,.2)}.r.dark .stat .c.out svg{stroke:#F97066}
.r.dark .stat .c.in{background:rgba(23,178,106,.2)}.r.dark .stat .c.in svg{stroke:#47CD89}
.r.dark [style*="background:#fff"]{background:#161D29 !important}
.r.dark [style*="background:#F7F8FA"]{background:#0B1018 !important}
.r.dark [style*="background:#EEF1F6"],.r.dark [style*="background:#EAECF0"]{background:#2A3444 !important}

.r.dark [style*="color:#101828"]{color:#F2F4F7 !important}

.r.dark [style*="color:#D92D20"]{color:#F97066 !important}

/* audit pass additions */
.sx{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 10px}
.sx a{font-size:14px;font-weight:600;display:flex;align-items:center;min-height:32px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:0 12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;font:600 12px Poppins,sans-serif;letter-spacing:.3px;text-transform:uppercase;color:#101828;cursor:pointer}
.cat .ct{width:56px;height:56px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center}
.cat .ct svg{width:24px;height:24px;fill:none;stroke:#101828;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cat.sel .ct{background:#101828}.cat.sel .ct svg{stroke:#fff}
.crow{display:flex;gap:10px;padding:0 16px;overflow:hidden}
.crow .cat{flex:none;width:66px}
.field{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 18px;box-sizing:border-box;background:#fff;border-radius:18px;border:0;font:500 15px Poppins,sans-serif;color:#101828;cursor:pointer}
.field svg{width:20px;height:20px;flex:none;fill:none;stroke:#101828;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field .ph{color:#98A2B3}
.key{height:48px;border:0;border-radius:16px;background:#F2F4F7;font:600 21px Poppins,sans-serif;color:#101828;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 16px}.kp:not(.big) .key{height:44px}
.kp.big .key{height:64px;border-radius:20px;font-size:26px;background:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0}
.handle{width:40px;height:5px;border-radius:3px;background:#EAECF0;margin:10px auto 0}
.sbtn{display:flex;align-items:center;justify-content:center;height:56px;margin:0 16px;border-radius:20px;background:#101828;color:#fff !important;font-size:17px;font-weight:600}
.btn.off,.sbtn.off{background:#D0D5DD;color:#fff !important;pointer-events:none}
.redbtn{display:flex;align-items:center;justify-content:center;height:56px;border-radius:20px;background:#D92D20;color:#fff !important;font-size:17px;font-weight:600}
.ghostbtn{display:flex;align-items:center;justify-content:center;height:52px;font-size:16px;font-weight:600}
.err{display:flex;gap:10px;align-items:flex-start;background:#FEE4E2;color:#B42318;border-radius:18px;padding:12px 14px;font-size:13px;line-height:1.45;font-weight:500}
.err svg,.info svg,.okb svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.info{display:flex;gap:10px;align-items:flex-start;background:#EEF1F6;color:#344054;border-radius:18px;padding:12px 14px;font-size:13px;line-height:1.45;font-weight:500}
.okb{display:flex;gap:10px;align-items:flex-start;background:#D1FADF;color:#05603A;border-radius:18px;padding:12px 14px;font-size:13px;line-height:1.45;font-weight:500}
.warnb{display:flex;gap:10px;align-items:flex-start;background:#FEF0C7;color:#93370D;border-radius:18px;padding:12px 14px;font-size:13px;line-height:1.45;font-weight:500}
.warnb svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.inp{display:flex;align-items:center;height:56px;padding:0 18px;background:#fff;border-radius:18px;font-size:17px;font-weight:500;box-sizing:border-box}
.inp.focus{box-shadow:0 0 0 2px #101828}.inp.bad{box-shadow:0 0 0 2px #D92D20}
.cur{display:inline-block;width:2px;height:22px;background:#101828;margin-left:1px;vertical-align:middle}
.kb{position:absolute;left:0;right:0;bottom:0;height:291px;background:#D1D4DB;padding:8px 3px 0;box-sizing:border-box}
.kb .kr{display:flex;justify-content:center;gap:6px;margin-bottom:11px}
.kb .kk{height:42px;flex:0 0 33px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #898A8D;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:400;color:#000}
.kb .kk.w{flex:0 0 44px;background:#ABB0BA;font-size:14px}.kb .kk.sp{flex:0 0 186px;font-size:15px}.kb .kk.go{flex:0 0 88px;background:#101828;color:#fff;font-size:15px}
.dlg{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);background:#fff;border-radius:30px;padding:26px 22px 18px;box-sizing:border-box;text-align:center}
.dlg h2{margin:16px 0 0;font-size:21px;font-weight:700}
.dlg p{margin:8px 0 0;font-size:14px;line-height:1.5;color:#5B6B86}
.pl{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.pl.red{background:#FEE4E2;color:#B42318}.pl.amb{background:#FEF0C7;color:#93370D}.pl.grn{background:#D1FADF;color:#05603A}
.paybtn{height:34px;padding:0 12px;border-radius:999px;background:#101828;color:#fff !important;font-size:13px;font-weight:600;display:flex;align-items:center;flex:none}
.pdl{display:flex;gap:18px;justify-content:center;margin-top:26px}
.pdl i{width:16px;height:16px;border-radius:50%;border:2px solid #98A2B3;box-sizing:border-box}
.pdl i.on{background:#101828;border-color:#101828}.pdl.bad i{border-color:#D92D20}
.eb{width:96px;height:96px;border-radius:50%;background:#EEF1F6;margin:0 auto;display:flex;align-items:center;justify-content:center}
.eb svg{width:40px;height:40px;fill:none;stroke:#101828;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eb.err{background:#FEE4E2}.eb.err svg{stroke:#D92D20}
.r.dark .eb{background:#232C3A}.r.dark .eb svg{stroke:#F2F4F7}.r.dark .eb.err{background:rgba(240,68,56,.2)}.r.dark .eb.err svg{stroke:#F97066}
.eb.ok{background:#D1FADF}.eb.ok svg{stroke:#067647}.r.dark .eb.ok{background:rgba(23,178,106,.2)}.r.dark .eb.ok svg{stroke:#47CD89}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid #EAECF0;border-top-color:#101828;box-sizing:border-box}
.r.dark .field .ph{color:#667085}
.r.dark .cat{color:#F2F4F7}.r.dark .cat .ct{background:#161D29}.r.dark .cat .ct svg{stroke:#F2F4F7}
.r.dark .cat.sel .ct{background:#F2F4F7}.r.dark .cat.sel .ct svg{stroke:#0B1018}
.r.dark .key{background:#232C3A;color:#F2F4F7}.r.dark .kp.big .key{background:#161D29}
.r.dark .handle{background:#344054}
.r.dark .sbtn{background:#F2F4F7;color:#0B1018 !important}
.r.dark .btn.off,.r.dark .sbtn.off{background:#2A3444;color:#667085 !important}
.r.dark .redbtn{background:#F04438}
.r.dark .err{background:rgba(240,68,56,.16);color:#FDA29B}
.r.dark .info{background:#1C2536;color:#D0D5DD}
.r.dark .okb{background:rgba(23,178,106,.16);color:#75E0A7}
.r.dark .warnb{background:rgba(247,144,9,.16);color:#FEC84B}
.r.dark .inp{background:#161D29}.r.dark .inp.focus{box-shadow:0 0 0 2px #F2F4F7}.r.dark .inp.bad{box-shadow:0 0 0 2px #F97066}
.r.dark .cur{background:#F2F4F7}
.r.dark .kb{background:#2B2F36}.r.dark .kb .kk{background:#4A4F57;color:#fff;box-shadow:0 1px 0 #111}.r.dark .kb .kk.w{background:#363A41}.r.dark .kb .kk.go{background:#F2F4F7;color:#0B1018}
.r.dark .dlg{background:#161D29}.r.dark .dlg p{color:#98A2B3}
.r.dark .pl.red{background:rgba(240,68,56,.2);color:#FDA29B}.r.dark .pl.amb{background:rgba(247,144,9,.2);color:#FEC84B}.r.dark .pl.grn{background:rgba(23,178,106,.2);color:#75E0A7}
.r.dark .paybtn{background:#F2F4F7;color:#0B1018 !important}
.r.dark .pdl i.on{background:#F2F4F7;border-color:#F2F4F7}.r.dark .pdl.bad i{border-color:#F97066}
.r.dark .spin{border-color:#232C3A;border-top-color:#F2F4F7}
</style>
</helmet>
