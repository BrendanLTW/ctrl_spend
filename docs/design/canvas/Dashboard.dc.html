<style>
body{margin:0;background:#F7F8FA}
a{color:#101828;text-decoration:none}a:hover{color:#344054}
.r{width:390px;height:844px;position:relative;overflow:hidden;background:#F7F8FA;color:#101828;font-family:Poppins,sans-serif;font-feature-settings:"tnum"}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:600}
.lbl{font-size:13px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:#5B6B86}
.mut{color:#5B6B86}
.sec{display:flex;justify-content:space-between;align-items:center;padding:22px 24px 12px}
.sec a{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:600;min-height:32px}
.sec a svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;background:#E4DBF7}
.ic svg{width:22px;height:22px;fill:none;stroke:#6D3FD1;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.food{background:#FFE2B8}.ic.food svg{stroke:#C25E00}
.ic.car{background:#CDE6FB}.ic.car svg{stroke:#1769C2}
.ic.bag{background:#FBD3E1}.ic.bag svg{stroke:#C8174F}
.ic.bolt{background:#FFF0B8}.ic.bolt svg{stroke:#8A6100}
.ic.wallet{background:#C9F3D5}.ic.wallet svg{stroke:#1E8A43}
.row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;margin:0 16px 10px;padding:12px 18px 12px 12px;min-height:72px;box-sizing:border-box;color:#101828}
.row:hover{color:#101828}
.grow{flex:1;min-width:0}
.n{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:#5B6B86;margin-top:1px}
.amt{font-size:16px;font-weight:700;white-space:nowrap}
.neg{color:#D92D20}.pos{color:#067647}
.top{display:flex;align-items:center;gap:12px;height:64px;padding:0 16px 0 24px}
.iconbtn{width:48px;height:48px;border-radius:50%;background:#EEF1F6;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:#101828;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:48px;height:48px;border-radius:50%;background:#101828;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.avatar:hover{color:#fff;background:#1D2939}
.hero{display:block;background:#101828;color:#fff;border-radius:32px;margin:8px 16px 0;padding:22px 22px 20px}
.hero:hover{color:#fff}
.hero .hd{display:flex;align-items:center;gap:16px}
.hero .w{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hero .w svg{width:26px;height:26px;fill:none;stroke:#101828;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .hl{font-size:13px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:#D0D5DD}
.hero .v{font-size:32px;font-weight:700;letter-spacing:-.8px;line-height:1.2}.hero .v small{font-size:18px;color:#98A2B3;letter-spacing:0}
.hero .go{margin-left:auto;align-self:flex-start;width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero .bar{height:10px;border-radius:999px;background:#475467;overflow:hidden;margin-top:22px}.hero .bar i{display:block;height:100%;border-radius:999px;background:#fff}
.hero .ft{display:flex;justify-content:space-between;margin-top:12px;font-size:14px;font-weight:500;color:#EAECF0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 16px 0}
.stat{background:#fff;border-radius:26px;padding:16px 14px;display:flex;align-items:center;gap:12px}
.stat .c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.stat .c svg{width:24px;height:24px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat .c.out{background:#FEE4E2}.stat .c.out svg{stroke:#D92D20}
.stat .c.in{background:#D1FADF}.stat .c.in svg{stroke:#067647}
.stat .lbl{font-size:11px}
.stat .v{font-size:21px;font-weight:700;line-height:1.3}.stat .v small{font-size:12px;font-weight:600;margin-right:4px}
.nav{position:absolute;left:16px;bottom:24px;width:278px;height:68px;border-radius:999px;background:#fff;box-shadow:0 8px 28px rgba(16,24,40,.08);display:flex;align-items:center;gap:2px;padding:0 8px;box-sizing:border-box}
.nav a{flex:1;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;color:#101828;font-size:0}
.nav a:hover{background:#F2F4F7}
.nav a.on{flex:none;padding:0 14px;background:#EEF1F6;font-size:14px;font-weight:600}
.nav svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:absolute;right:16px;bottom:26px;width:64px;height:64px;border-radius:50%;background:#101828;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(16,24,40,.28)}

.r.dark .key:hover,.r.dark .chip:hover,.r.dark .cat:hover .ct,.r.dark .nav a:hover{background:#232C3A}
.r.dark .nav{box-shadow:0 8px 28px rgba(0,0,0,.5)}

.r.dark .seg button.sel,.r.dark .chip.sel,.r.dark .cat.sel .ct,.r.dark .btn,.r.dark .pill,.r.dark .avatar,.r.dark .fab,.r.dark .toast{background:#F2F4F7;color:#0B1018}

.r.dark .toast button{color:#B54708}
.r.dark .hero{background:#1C2536}.r.dark .hero .bar{background:#344054}
.r.dark .neg{color:#F97066}.r.dark .pos{color:#47CD89}.r.dark .warn{color:#FDB022}

.r.dark .ic.wallet{background:rgba(23,178,106,.22)}.r.dark .ic.wallet svg{stroke:#5BD996}

.r.dark [style*="color:#101828"]{color:#F2F4F7 !important}
.r.dark [style*="color:#5B6B86"]{color:#98A2B3 !important}

.r.dark [style*="background:rgba(16,24,40"]{background:rgba(0,0,0,.6) !important}
.iconbtn{position:relative}.iconbtn .dot{position:absolute;top:11px;right:12px;width:10px;height:10px;border-radius:50%;background:#D92D20;border:2px solid #EEF1F6;box-sizing:border-box}

</style>
