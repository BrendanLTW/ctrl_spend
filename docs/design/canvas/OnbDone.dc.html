<style>
body{margin:0;background:#F7F8FA}
a{color:#101828;text-decoration:none}a:hover{color:#344054}
.r{width:390px;height:844px;position:relative;overflow:hidden;background:#F7F8FA;color:#101828;font-family:Poppins,sans-serif;font-feature-settings:"tnum"}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:600}
.lbl{font-size:13px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:#5B6B86}
.mut{color:#5B6B86}
.card{background:#fff;border-radius:28px}
.top{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;height:56px;padding:0 8px}
.top a{display:flex;align-items:center;justify-content:center;height:44px;min-width:44px;font-size:15px;font-weight:600}
.top .skip{color:#5B6B86}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:28px;height:6px;border-radius:999px;background:#E4E7EC}.steps i.on{background:#101828}
.hd{padding:8px 24px 0}
.hd h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.hd p{margin:10px 0 0;font-size:15px;line-height:1.5;color:#5B6B86}
.sec{padding:22px 24px 10px}
.group{background:#fff;border-radius:28px;margin:0 16px;overflow:hidden}
.gi{display:flex;align-items:center;gap:16px;padding:14px 18px;min-height:64px;box-sizing:border-box;border-bottom:1px solid #EEF1F6}
.gi:last-child{border-bottom:0}
.gn{flex:1;min-width:0;font-size:16px;font-weight:600}
.gs{display:block;font-size:13px;font-weight:400;color:#5B6B86;line-height:1.45;margin-top:2px}
.chev{width:20px;height:20px;flex:none;fill:none;stroke:#101828;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;background:#E4DBF7}
.ic svg{width:22px;height:22px;fill:none;stroke:#6D3FD1;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.food{background:#FFE2B8}.ic.food svg{stroke:#C25E00}
.ic.car{background:#CDE6FB}.ic.car svg{stroke:#1769C2}
.ic.bag{background:#FBD3E1}.ic.bag svg{stroke:#C8174F}
.ic.bolt{background:#FFF0B8}.ic.bolt svg{stroke:#8A6100}
.ic.wallet{background:#C9F3D5}.ic.wallet svg{stroke:#1E8A43}
.btn{position:absolute;left:16px;right:16px;bottom:34px;display:flex;align-items:center;justify-content:center;height:58px;border-radius:22px;background:#101828;color:#fff;font-size:17px;font-weight:600}
.btn:hover{color:#fff;background:#1D2939}
.btn.up{bottom:96px}
.link{position:absolute;left:16px;right:16px;bottom:34px;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.bar{height:10px;border-radius:999px;background:#EEF1F6;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:#101828}
.day{height:56px;border:0;border-radius:18px;background:#fff;font:600 16px Poppins,sans-serif;color:#101828;cursor:pointer}
.day:hover{background:#EEF1F6}.day.sel{background:#101828;color:#fff}
.tg{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:999px;background:#D0D5DD;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.2)}
.tg.on{background:#101828}.tg.on::after{left:23px}
.ab{height:40px;padding:0 16px;flex:none;border:0;border-radius:999px;background:#F2F4F7;font:600 14px Poppins,sans-serif;color:#101828;cursor:pointer;display:flex;align-items:center;gap:4px}
.ab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ab.add{color:#5B6B86}
.panel{background:#101828;color:#fff}
.fl{background:#fff;color:#101828}
.appic{background:#101828}
.kv{display:flex;justify-content:space-between;align-items:center;height:58px;padding:0 20px;border-bottom:1px solid #EEF1F6;font-size:15px}
.kv:last-child{border-bottom:0}.kv span:last-child{font-weight:600}
.okc{background:#D1FADF}.okc svg{stroke:#067647}

.r.dark .cat.sel .ct svg,.r.dark .fab svg{stroke:#0B1018}
.r.dark .fab{box-shadow:0 10px 24px rgba(0,0,0,.5)}
.r.dark .toast button{color:#B54708}
.r.dark .hero{background:#1C2536}.r.dark .hero .bar{background:#344054}
.r.dark .neg{color:#F97066}.r.dark .pos{color:#47CD89}.r.dark .warn{color:#FDB022}

.r.dark .ic.food{background:rgba(251,140,0,.2)}.r.dark .ic.food svg{stroke:#FFB547}
.r.dark .ic.car{background:rgba(33,150,243,.22)}.r.dark .ic.car svg{stroke:#6CB8FF}
.r.dark .ic.bag{background:rgba(240,69,122,.22)}.r.dark .ic.bag svg{stroke:#FF7AA2}
.r.dark .ic.bolt{background:rgba(245,184,0,.2)}.r.dark .ic.bolt svg{stroke:#FFD34D}
.r.dark .ic.wallet{background:rgba(23,178,106,.22)}.r.dark .ic.wallet svg{stroke:#5BD996}
.r.dark .ic.health{background:rgba(240,68,56,.22)}.r.dark .ic.health svg{stroke:#FF8A80}
.r.dark .ic.gift{background:#232C3A}.r.dark .ic.gift svg{stroke:#98A2B3}

.r.dark .day{background:#161D29;color:#F2F4F7}.r.dark .day:hover{background:#232C3A}.r.dark .day.sel{background:#F2F4F7;color:#0B1018}
.r.dark .tg{background:#344054}.r.dark .tg.on{background:#F2F4F7}.r.dark .tg.on::after{background:#0B1018}
.r.dark .ab{background:#232C3A;color:#F2F4F7}.r.dark .ab.add{color:#98A2B3}
